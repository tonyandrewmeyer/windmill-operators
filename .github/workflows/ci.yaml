name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charm: [windmill, windmill-worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Sync dependencies
        working-directory: charms/${{ matrix.charm }}
        run: uv sync

      - name: Format check
        working-directory: charms/${{ matrix.charm }}
        run: uv run --group lint ruff format --check --diff src tests

      - name: Lint
        working-directory: charms/${{ matrix.charm }}
        run: uv run --group lint ruff check src tests

      - name: Type check
        working-directory: charms/${{ matrix.charm }}
        run: uv run --group lint pyright

      - name: Codespell
        working-directory: charms/${{ matrix.charm }}
        run: uv run --group lint codespell .

      - name: Unit tests
        working-directory: charms/${{ matrix.charm }}
        env:
          PYTHONPATH: src:lib
        run: uv run --group unit coverage run -m pytest tests/unit -v

      - name: Coverage report
        working-directory: charms/${{ matrix.charm }}
        run: uv run --group unit coverage report

  build:
    name: Pack charm
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        charm: [windmill, windmill-worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Pack
        working-directory: charms/${{ matrix.charm }}
        run: charmcraft pack
      - name: Upload charm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.charm }}.charm
          path: charms/${{ matrix.charm }}/*.charm

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        charm: [windmill, windmill-worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup MicroK8s Juju
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          provider: microk8s
          juju-channel: 3.6/stable
      - name: Download charm
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.charm }}.charm
          path: charms/${{ matrix.charm }}/
      - name: Run integration tests
        working-directory: charms/${{ matrix.charm }}
        env:
          CHARM_PATH: ${{ matrix.charm }}_amd64.charm
        run: tox -e integration
