type: charm
name: windmill
title: Windmill
summary: Windmill developer platform — server (API, frontend, scheduler).
description: |
  Windmill is an open-source developer platform to build internal tools,
  scripts, flows, apps and scheduled jobs from scripts in Python,
  TypeScript/Deno, Go, Bash and more. All state is held in PostgreSQL; the
  server is stateless and horizontally scalable.

  This charm deploys the Windmill **server** (the API + web frontend and the
  job scheduler). It requires a `postgresql_client` relation (e.g. the
  `postgresql-k8s` charm) and, optionally, an `ingress` relation (e.g.
  `traefik-k8s`) and COS relations for metrics, logs and traces.

  Workers that execute jobs are deployed separately via the
  `windmill-worker` charm, which shares the same PostgreSQL queue. Both the
  server and the workers are stateless; back up the database to back up the
  instance.

  Upstream: https://github.com/windmill-labs/windmill

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

charm-libs:
  - lib: data-platform-libs.data_interfaces
    version: "1"
  - lib: traefik_k8s.ingress
    version: "2"
  - lib: prometheus_k8s.prometheus_scrape
    version: "0"
  - lib: loki_k8s.loki_push_api
    version: "1"
  - lib: tempo_coordinator_k8s.tracing
    version: "0"

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

containers:
  windmill:
    resource: windmill-image
    mounts:
      - storage: logs
        location: /tmp/windmill/logs

resources:
  windmill-image:
    type: oci-image
    description: |
      OCI image for the Windmill server container. Default is the Community
      Edition (ghcr.io/windmill-labs/windmill:main). Use
      ghcr.io/windmill-labs/windmill-ee:main for the Enterprise Edition.
    upstream-source: ghcr.io/windmill-labs/windmill:main

storage:
  logs:
    type: filesystem
    location: /tmp/windmill/logs

requires:
  database:
    interface: postgresql_client
    limit: 1
  ingress:
    interface: ingress
    limit: 1
  logging:
    interface: loki_push_api
  tracing:
    interface: tracing
    limit: 1

provides:
  metrics-endpoint:
    interface: prometheus_scrape

config:
  options:
    image-username:
      type: string
      default: ""
      description: |
        Username (and password, via the image-password secret config) for the
        private registry hosting the windmill OCI image. Leave empty for the
        public ghcr.io images.
    base-url:
      type: string
      default: ""
      description: |
        Public base URL of the Windmill instance, e.g.
        https://windmill.example.com. When an ingress relation is present this
        is derived automatically from the ingress URL unless set explicitly.
    json-logs:
      type: boolean
      default: true
      description: |
        Emit structured JSON logs (JSON_FMT=true). Recommended when shipping
        logs to Loki or another log aggregator.
    db-connections:
      type: int
      default: 50
      description: |
        Maximum number of PostgreSQL connections in the server's pool
        (DATABASE_CONNECTIONS). Increase for large deployments.
    zombie-job-timeout:
      type: int
      default: 30
      description: |
        Seconds after which a job whose worker died is declared a zombie
        (ZOMBIE_JOB_TIMEOUT).
    restart-zombie-jobs:
      type: boolean
      default: true
      description: |
        Restart zombie jobs instead of failing them (RESTART_ZOMBIE_JOBS).
    enable-metrics:
      type: boolean
      default: true
      description: |
        Expose Prometheus metrics on port 8001 (METRICS_ADDR). Note: metrics
        are an Enterprise Edition feature of Windmill; on Community Edition the
        port may not open and scrapes will fail until an EE image is used.
    enable-smtp-trigger:
      type: boolean
      default: false
      description: |
        Start the inbound SMTP listener on port 2525 used by email-triggered
        flows. Expose the port externally (e.g. via a TCP load balancer) to
        receive mail.
    superadmin-secret:
      type: string
      default: ""
      description: |
        Bearer token that grants virtual superadmin identity
        (SUPERADMIN_SECRET). Required to use the set-admin-password action and
        to administer the instance through the API. Rotate it like any other
        privileged secret.
    ca-cert:
      type: string
      default: ""
      description: |
        PEM-encoded CA certificate to trust for outbound TLS connections made
        by the server (e.g. to the database or OIDC providers). Mounted into
        the container's CA bundle.

actions:
  restart:
    description: Restart the Windmill server workload (Pebble service).
  set-admin-password:
    description: |
      Rotate the password of the initial admin user
      (admin@windmill.dev). Requires the superadmin-secret config option to be
      set. The new password is returned in the action results and is also set
      as a Juju secret owned by the charm.
    params:
      password:
        type: string
        description: |
          New password for the admin user. If omitted, a strong random
          password is generated.
    required: []
  pre-backup:
    description: |
      Hook that prepares the instance for a consistent PostgreSQL backup.
      Currently a no-op that confirms the server is healthy; intended to be
      wired to the database charm's backup pre-hook in future revisions.
  post-restore:
    description: |
      Hook to run after a PostgreSQL restore. Reconciles the workload with the
      restored database (restarts the server so migrations and connection
      pools re-initialise).
