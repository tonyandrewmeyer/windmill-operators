[project]
name = "windmill"
version = "0.1.0"
requires-python = ">=3.10"

# Dependencies of the charm code in src/, including transitive dependencies of
# the charm libraries fetched into lib/ (declared in charmcraft.yaml).
dependencies = [
    "ops~=3.7",
    # charm library transitive dependencies:
    "pydantic>=2.11",  # traefik_k8s ingress
    "cosl>=0.0.53",    # prometheus_scrape, loki_push_api
    "pg8000>=1.31",    # pure-python postgres client for the init-db action
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
    "pyright",
    # pyright needs to resolve test imports too:
    "pytest",
    "ops[testing]",
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
integration = [
    "jubilant",
    "pytest",
    "PyYAML",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock"

[tool.pyright]
include = ["src", "tests"]
exclude = ["lib", "tests/integration"]
extraPaths = ["src", "lib"]

[tool.ruff]
line-length = 99
extend-exclude = [
    "__pycache__",
    "*.egg_info",
    "lib",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
