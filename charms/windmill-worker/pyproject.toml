[project]
name = "windmill-worker"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "ops~=3.7",
    # charm library transitive dependencies:
    "pydantic>=2.11",  # data_platform_libs
    "cosl>=0.0.53",    # prometheus_scrape, loki_push_api
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
    "pyright",
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
integration = [
    "jubilant",
    "pytest",
    "PyYAML",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}
extend-exclude = ["__pycache__", "*.egg_info", "lib"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock"

[tool.pyright]
include = ["src", "tests"]
exclude = ["lib", "tests/integration"]
extraPaths = ["src", "lib"]
